name: Create tag

on:
  workflow_dispatch:

env:
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

permissions:
  contents: read

jobs:
  create-tag:
    if: github.actor == 'skarllot'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 🛡️ Harden Runner
      uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
      with:
        egress-policy: block
        disable-sudo-and-containers: true
        allowed-endpoints: >
          *.azureedge.net:443
          aka.ms:443
          api.nuget.org:443
          builds.dotnet.microsoft.com:443
          ci.dot.net:443
          github.com:443

    - name: 🛒 Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: 🧰 Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: global.json

    - name: 🛠️ Setup Nerdbank.GitVersioning
      run: dotnet tool install --tool-path . nbgv

    - name: 🏷️ Tag release
      run: ./nbgv tag

    - name: 🚀 Push Git tags
      run: git push --tags