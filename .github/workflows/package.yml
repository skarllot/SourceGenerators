name: Package

on:
  release:
    types: [published]

env:
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

permissions:
  contents: read

jobs:
  nuget:

    runs-on: ubuntu-latest

    steps:
      - name: 🛡️ Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          disable-sudo-and-containers: true
          allowed-endpoints: >
            *.azureedge.net:443
            *.digicert.com:80
            *.nuget.org:443
            *.ws.symantec.com:80
            aka.ms:443
            builds.dotnet.microsoft.com:443
            ci.dot.net:443
            dc.services.visualstudio.com:443
            github.com:443
            s.symcb.com:80
            s.symcd.com:80
            www.microsoft.com:80

      - name: 🛒 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: 'true'

      - name: 🧰 Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: 🗃️ Setup NuGet cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: 📥 Restore dependencies
        run: dotnet restore --locked-mode

      - name: 🏗️ Build
        run: dotnet build --no-restore -c Release

      - name: 📦 Pack
        run: dotnet pack /p:CI=true /p:PublicRelease=true --no-build -c Release

      - name: 🚀 Publish
        run: dotnet nuget push "artifacts/*.nupkg" -s https://api.nuget.org/v3/index.json -k ${{ secrets.NUGET_APIKEY }} --skip-duplicate
